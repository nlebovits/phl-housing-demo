name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # rashid takes a floor, not a pin. A pin goes stale the day the template
      # is created and every repo made from it inherits the stale version. A
      # floor takes each new 0.1.x release and still refuses a rashid that does
      # not carry the rules tests/test_conformance.py asserts. The gate checks
      # the same range at run time, so a local rashid cannot be older.
      #
      # stac-check stays unpinned on purpose. The stac-check exemption in
      # docs/conformance.md expires when the upstream crash stops. That only
      # happens if CI takes each new release.
      - name: Install the validators
        run: python -m pip install 'rashid>=0.1.5,<0.2.0' stac-check

      # tests/test_refresh.py reads GeoParquet and runs DuckDB. It needs these
      # two, not the whole refresh toolchain.
      - name: Install the refresh test dependencies
        run: python -m pip install duckdb pyarrow

      - name: Lint the tooling
        run: |
          python -m pip install pyflakes
          pyflakes tools/*.py tests/*.py

      # tests/test_queries.py runs every SQL block in the AGENTS.md files
      # against the published bucket, so a moved asset or a renamed column
      # fails here rather than on a reader. It skips itself when duckdb is
      # absent, so the install is what makes the gate real.
      - name: Install DuckDB
        run: |
          curl -fsSL --retry 3 -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.5.1/duckdb_cli-linux-amd64.zip
          unzip -q /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      # CI_LIGHT exempts asset hrefs with a data suffix from the link check.
      # The checkout holds the metadata and not the bytes. Structural links
      # and every non-data asset still resolve. Leave it unset locally.
      - name: Catalog gates
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py
