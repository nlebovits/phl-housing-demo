# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.
#
# PUBLISHER: the scheduled refresh (.github/workflows/refresh.yml) owns the
# data. tools/upload_data.py uploads the staged versions and tools/publish.py
# uploads catalog/. Do not run `portolan push` on this catalog. See AGENTS.md
# and docs/refresh.md.
#
# The workflow signs in to the Source data proxy, which names the bucket
# differently. It overrides write_prefix with PUBLISH_WRITE_PREFIX and
# data_dir with PUBLISH_DATA_DIR. The values below serve a maintainer who
# publishes by hand with a profile.

# The S3 URI uploads are written to.
write_prefix: s3://us-west-2.opendata.source.coop/nlebovits/phl-housing-demo

# The public base URL that serves write_prefix. Every href in the catalog is
# built from this, so it goes in the STAC JSON and write_prefix does not.
public_base: https://data.source.coop/nlebovits/phl-housing-demo

region: us-west-2

# The named AWS profile the publisher uses. Left unset so the default boto3
# session applies and each maintainer picks their own. Source Cooperative
# issues per-account credentials; store them in a profile and select it with
# AWS_PROFILE=<name> when publishing. Nothing secret belongs in this file.
# profile: source-coop

# The directory that IS the published catalog, synced 1:1 to write_prefix.
# Nothing outside it is ever uploaded.
publish_dir: catalog

# The staging directory that holds data files, read by tools/upload_data.py.
# Optional. Leave it commented out if you stage no data. tools/publish.py
# never reads this key, so setting it does not widen the publish boundary.
# Data files are too large for git, so keep this directory out of the
# repository or ignored by it. Only the suffixes in PUBLISHABLE_SUFFIXES
# upload. See the allow-list in tools/upload_data.py.
# data_dir: ../catalog-staging
